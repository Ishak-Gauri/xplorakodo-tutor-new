# Render Blueprint: web service + PostgreSQL (pgvector is enabled by the app with CREATE EXTENSION vector).
# Note: Render's FREE Postgres expires after 30 days. For data that lasts, use a paid Render Postgres
# plan, or a free Neon/Supabase database and paste its URL into DATABASE_URL (see DEPLOY.md).
services:
  - type: web
    name: xplorakodo-tutor
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips='*'
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        fromDatabase:
          name: xplorakodo-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@xplorakodo.com
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
      - key: LLM_PROVIDER
        value: openai
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_API_KEY
        sync: false
      - key: LANGSMITH_PROJECT
        value: xplorakodo-tutor
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false
      - key: EMBEDDING_PROVIDER
        value: hash

databases:
  - name: xplorakodo-db
    plan: free
    databaseName: xplorakodo
    user: xk
