# Local stack: PostgreSQL 16 + pgvector, and the app.
#   docker compose up -d db          # just the database (run the app with uvicorn)
#   docker compose up --build        # database + app on http://localhost:8000
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: xk
      POSTGRES_PASSWORD: xk
      POSTGRES_DB: xplorakodo
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/001_test_db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xk -d xplorakodo"]
      interval: 3s
      retries: 20
  app:
    build: .
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://xk:xk@db:5432/xplorakodo
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-change-me-0123456789}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@xplorakodo.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe!2026}
      LLM_PROVIDER: ${LLM_PROVIDER:-mock}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports: ["8000:8000"]
volumes:
  pgdata:
